plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    // JEI is optional: compiled against its API only, never required at runtime (client/RecipeViewer)
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.57.0.447"
    // the -neoforge artifact carries mojmap names, like the REI / EMI lines above
    compileOnly "maven.modrinth:jade:15.10.6+neoforge"
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    // Team Reborn Energy is optional (FTB Quests bundles it on Fabric); compiled against only, never required
    modCompileOnly "teamreborn:energy:4.1.0"
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        // opens the test world and walks the screens with screenshots (client/DevTour), like the NeoForge clientTest run
        clientTest {
            client()
            setConfigName('Fabric Client Test')
            ideConfigGenerated(false)
            runDir('runs/client')
            programArgs('--quickPlaySingleplayer', 'ppworld')
            property('quest_tree.devTour', 'true')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}