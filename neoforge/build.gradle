plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// In-game tests live in their own source set and companion mod so they never reach the shipped jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    addModdingDependenciesTo sourceSets.gametest
    addModdingDependenciesTo sourceSets.test
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
            if (it.name != 'gameTestServer') {
                loadedMods = [project.neoForge.mods.getByName(mod_id)]
            }
        }
        client {
            client()
        }
        // opens the test world (run/saves/ppworld) directly; used for automated checks of the screen
        clientTest {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'ppworld'
            // scripted walk through the screens with screenshots (client/DevTour); no keyboard or mouse input needed
            systemProperty 'quest_tree.devTour', 'true'
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
        // plays a pack's FTB Quests questline through FTB Quests and through the import side by side (FtbqDiff);
        // needs FTB Quests and its libraries in runs/ftbqdiff/mods and the quests in runs/ftbqdiff/config/ftbquests
        ftbqDiff {
            server()
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('runs/ftbqdiff')
            programArgument '--nogui'
            systemProperty 'quest_tree.ftbqDiff', (project.findProperty('ftbqDiffSteps') ?: '400').toString()
            loadedMods = [project.neoForge.mods.getByName(mod_id), project.neoForge.mods.getByName("${mod_id}_gametest")]
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty('neoforge.enabledGameTestNamespaces', "${mod_id},${mod_id}_gametest")
            loadedMods = [project.neoForge.mods.getByName(mod_id), project.neoForge.mods.getByName("${mod_id}_gametest")]
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // JEI / REI / EMI are optional: compiled against their APIs only, never required at runtime
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.57.0.447"
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
